            <figcaption class="fig__cap"><b>Fig 2.</b> One of these sits at every aligned layer. It
            never overwrites the Receiver's cache — it computes a correction and adds it, so a Fuser
            that learns nothing costs nothing. The gate decides per layer whether that correction is
            applied at all: soft enough to train by gradient, hard enough by the end of training to
            be an actual yes or no.</figcaption>
          </figure>
