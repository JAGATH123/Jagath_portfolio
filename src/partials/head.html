     SUBSET_AT_BUILD is filled in by scripts/build.py from the characters this page
     actually contains. It used to be a hand-written list, which is a silent failure:
     a character missing from it falls back to a system font mid-word and the page
     still looks plausible. Two had already gone missing. -->
